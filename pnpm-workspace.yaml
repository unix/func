packages:
  - benchmarks
  - examples/*
  - apps/alias
  - apps/docs
  - apps/redirect
  - packages/core
  - packages/contracts
  - packages/funcgo
  - packages/init

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  msw: true
  sharp: true
  workerd: true

overrides:
  funcgo@1.2.0-canary.0>func: 3.0.0-canary.1

minimumReleaseAgeExclude:
  - '@unix/prettier@0.1.0'
  - astro-join-line@0.1.0
  - astro@7.2.0
  - '@astrojs/cloudflare@14.2.0'
  - '@cloudflare/workers-types@5.20260808.1'
  - miniflare@5.20260801.1-alpha
  - wrangler@4.120.0
  - eslint@10.8.1
  - astro-vite-cache-isolation@0.1.0
  - func@3.0.0-canary.1
  - funcgo@1.2.0-canary.0
