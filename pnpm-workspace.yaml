packages:
  - benchmarks
  - packages/core
  - packages/docs
  - packages/alias
  - packages/funcgo
  - packages/init
  - packages/redirect
  - packages/shared
  - packages/template

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  msw: true
  sharp: true
  workerd: true

minimumReleaseAgeExclude:
  - '@unix/prettier@0.1.0'
  - astro-join-line@0.1.0
  - astro@7.2.0
  - '@astrojs/cloudflare@14.2.0'
  - '@cloudflare/workers-types@5.20260808.1'
  - miniflare@5.20260801.1-alpha
  - wrangler@4.120.0
  - eslint@10.8.1
