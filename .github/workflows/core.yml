name: Core

on:
  push:
    paths:
      - .github/workflows/core.yml
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - packages/core/**
  pull_request:
    paths:
      - .github/workflows/core.yml
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - packages/core/**

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          cache: pnpm
          node-version: 24
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run core end-to-end tests
        run: pnpm test:e2e
