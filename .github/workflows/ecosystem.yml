name: Published ecosystem

on:
  push:
    paths:
      - .github/workflows/ecosystem.yml
      - ecosystem-tests/**
      - package.json
  pull_request:
    paths:
      - .github/workflows/ecosystem.yml
      - ecosystem-tests/**
      - package.json
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 20.19.0
          - 22.12.0
          - 24
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - name: Test the published ecosystem
        run: npm --prefix ecosystem-tests test
