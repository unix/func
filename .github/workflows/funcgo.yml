name: Funcgo

on:
  pull_request:
    paths:
      - .github/workflows/funcgo.yml
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - examples/json-output/**
      - packages/contracts/**
      - packages/core/**
      - packages/funcgo/**

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          cache: pnpm
          node-version: 24
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run funcgo tests
        run: pnpm --filter funcgo test
